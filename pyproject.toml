[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechbench-runner"
version = "0.3.0"
description = "The mechbench runner: claims jobs from mechbench-api, executes protocols against mechbench-compute, and emits results. Also exposes those primitives as MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Benji Smith", email = "benji@shaxpir.com" }]
keywords = ["interpretability", "mechanistic-interpretability", "mlx", "mcp", "runner"]
# Honest about the split: the runner installs and runs anywhere, and the
# MLX backend it pulls in through mechbench-compute is Apple-Silicon
# only. `mechbench-runner doctor` says which half a given machine has.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Capped: mcp 2.0 removed `mcp.server.fastmcp` and restructured the
    # server surface entirely (`mcpserver`, `apps`, `runner`). Porting is
    # task 000298; until then an unbounded floor hands every fresh
    # install a broken MCP server, which is what shipping 0.1.0 did.
    "mcp>=1.2,<2",
    "mechbench-compute>=0.11",
    "mechbench-schema>=0.13",
    "certifi>=2024.2",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mechbench/mechbench-runner"
Website = "https://mechbench.ai"

[project.scripts]
mechbench-runner = "mechbench_runner.cli:main"

[tool.setuptools.packages.find]
include = ["mechbench_runner*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
