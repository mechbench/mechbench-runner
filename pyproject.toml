[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechbench-agent"
version = "0.1.0"
description = "Agent-facing surface (MCP + job-runner) for the mechbench platform. Wraps mechbench-core primitives as MCP tools and hosts a job-runner that polls mechbench-api."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.2",
    "mechbench-core>=0.1",
    "mechbench-schema>=0.2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
mechbench-agent = "mechbench_agent.cli:main"

[tool.setuptools.packages.find]
include = ["mechbench_agent*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
