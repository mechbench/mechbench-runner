[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechbench"
version = "0.6.2"
description = "The mechbench runner: claims jobs from mechbench-api, executes protocols against mechbench-compute, and emits results. Also exposes those primitives as MCP tools."
readme = "README.md"
# Capped on purpose, and only here. `uv tool install --managed-python`
# takes the newest managed CPython that satisfies this — with an open
# upper bound that meant 3.14.7 on 2026-08-23, a release nothing had
# ever been tested against. It happened to work; nothing would have
# warned anyone if it had not, and in three months it would silently be
# 3.15.
#
# An upper bound is bad manners in a library and normal in an
# application, which this is: mechbench-compute and mechbench-schema
# keep `>=3.11`. Raising this is meant to be deliberate — test the new
# interpreter, then bump — which is the same discipline as task 000300.
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Benji Smith", email = "benji@shaxpir.com" }]
keywords = ["interpretability", "mechanistic-interpretability", "mlx", "mcp", "runner"]
# Honest about the split: the runner installs and runs anywhere, and the
# MLX backend it pulls in through mechbench-compute is Apple-Silicon
# only. `mechbench doctor` says which half a given machine has.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Every third-party dep is capped below its next major: an
    # unbounded floor is a bet that the next major will not break you —
    # a bet 0.1.0 made on mcp and lost (every fresh install resolved
    # 2.0 and got a broken MCP server; the dev venv never saw it).
    # Ported to the mcp 2.x surface in 000298. Our own packages stay
    # floor-only: we publish them, so their majors are our choice.
    "mcp>=2,<3",
    "mechbench-compute>=0.15.6",
    "mechbench-schema>=0.13",
    "certifi>=2024.2",
    "httpx>=0.27,<1",
    "websockets>=13,<16",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mechbench/mechbench-runner"
Website = "https://mechbench.ai"

[project.scripts]
mechbench = "mechbench.cli:main"

[tool.setuptools.packages.find]
# Two modules, one distribution (task 000307): `mechbench` is the bare
# front door, `mechbench_runner` the engine behind it.
include = ["mechbench", "mechbench_runner*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
