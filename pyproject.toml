[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechbench-runner"
version = "0.1.0"
description = "The mechbench runner: claims jobs from mechbench-api, executes protocols against mechbench-compute, and emits results. Also exposes those primitives as MCP tools."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp>=1.2",
    "mechbench-compute>=0.9.1",
    "mechbench-schema>=0.13",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
mechbench-runner = "mechbench_runner.cli:main"

[tool.setuptools.packages.find]
include = ["mechbench_runner*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
