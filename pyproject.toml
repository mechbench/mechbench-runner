[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechbench"
version = "0.35.0"
description = "The mechbench runner: claims jobs from mechbench-api, executes protocols against mechbench-compute, and emits results. Also exposes those primitives as MCP tools."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Benji Smith", email = "benji@shaxpir.com" }]
keywords = ["interpretability", "mechanistic-interpretability", "mlx", "mcp", "runner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=2,<3",
    "mechbench-compute>=0.135.0",
    "mechbench-schema>=0.17.0",
    "certifi>=2024.2",
    "httpx>=0.27,<1",
    "websockets>=13,<16",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mechbench/mechbench-runner"
Website = "https://mechbench.ai"

[project.scripts]
mechbench = "mechbench.cli:main"

[tool.setuptools.packages.find]
include = ["mechbench", "mechbench_runner*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
