  #       env:
  #         GH_TOKEN: ${{ secrets.MECHBENCH_API_DISPATCH_TOKEN }}
  #       run: |
  #         v="${GITHUB_REF_NAME#v}"
  #         for i in $(seq 1 30); do
  #           curl -fsS "https://pypi.org/pypi/mechbench/${v}/json" >/dev/null && break
  #           sleep 20
  #         done
