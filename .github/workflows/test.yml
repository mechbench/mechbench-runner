name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Silicon: the runner pulls mechbench-compute, which pulls
    # mlx (macOS arm64 only). A fresh runner VM is also the fresh
    # machine the suite's fences assume — no ~/.mechbench, no HF
    # cache, no live service to touch (and conftest forbids touching
    # one anyway).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest build
      - run: python -m pytest tests/ -q
      # Fails on any package in the installed environment with a published
      # advisory (PyPI advisory database + OSV). Accepted exceptions are
      # listed here as `--ignore-vuln <id>` with the reason beside them;
      # there are none today.
      - name: audit dependencies
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off --vulnerability-service osv
          pip-audit --skip-editable --progress-spinner off --vulnerability-service pypi
